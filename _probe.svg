<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 150" width="420" height="150"><style>text{font-family:monospace;font-size:19px}</style><defs><clipPath id="a"><rect x="0" y="28" width="420" height="26"/></clipPath><clipPath id="b"><rect x="0" y="62" width="0" height="26"><animate attributeName="width" from="0" to="420" dur="0.6s" begin="0s" fill="freeze"/></rect></clipPath></defs><g fill="#888888"><text x="4" y="22">A plain text no clip</text><text x="4" y="48" clip-path="url(#a)">B static clipPath</text><text x="4" y="82" clip-path="url(#b)">C animated clipPath</text><text x="4" y="116">D baseline sans</text></g></svg>
