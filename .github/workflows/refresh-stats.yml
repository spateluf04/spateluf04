name: refresh stats

on:
  schedule:
    - cron: "17 5 * * *"     # an odd minute, because :00 is the busiest slot on
                             # the shared scheduler and gets delayed
  workflow_dispatch:
  # Deliberately no `push` trigger. This job commits, and a push trigger would
  # re-run it on its own commit.

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: draw the graphics
        env:
          # The built-in token is repo-scoped: it can only see public activity,
          # so the totals here count public contributions only. Enabling
          # "Include private contributions on my profile" in GitHub settings
          # changes the graph on your profile page but NOT this number, because
          # the setting governs display and the token governs access. Measured:
          # profile showed 124 for the year while this token reported 68.
          #
          # To count private work too, create a classic PAT with the `repo`
          # scope, save it as a repository secret named STATS_TOKEN, and this
          # picks it up automatically. The tradeoff is a credential to rotate,
          # so it is opt-in rather than required.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/generate_stats.py

      - name: commit only if something actually changed
        run: |
          # Keep this in step with ENABLED in scripts/generate_stats.py.
          FILES="stats.svg stats-dark.svg langs.svg langs-dark.svg"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES
          git commit -m "stats: refresh"
          git push
